name: v3-gate

on:
  push:
    paths:
      - 'tools/render-gate/**'
      - '.github/workflows/v3-gate.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v3-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      V3_SHA: "2b7a669827bab5b272919614fd5ccf17d94dae4288a8272a35a7603859b1107b"
      MC420: "https://raw.githubusercontent.com/AnEntrypoint/mc-420/main"
      GAIN: "0.00707945784384138"
      FAUST_LIB_PATH: ${{ github.workspace }}/dawdreamer/faustlibraries
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install build dependencies
        run: sudo apt-get install -y libncurses-dev unzip python3

      - name: Fetch the pinned libfaust for this runner
        run: |
          cd thirdparty/libfaust
          python3 download_libfaust.py --arch x86_64

      - name: Fetch v3.dsp and check its hash
        run: |
          set -e
          curl -fL "$MC420/docs/witness/pitch-2093-raw/lock-sub30/variants/v3.dsp" -o v3.dsp
          GOT=$(sha256sum v3.dsp | cut -d' ' -f1)
          echo "v3 sha $GOT"
          [ "$GOT" = "$V3_SHA" ] || { echo "::error::v3.dsp hash mismatch"; exit 1; }

      - name: Fetch the gate inputs
        run: |
          set -e
          mkdir -p in
          for f in crotale_high_C7 marimba_mid_C5B5; do
            curl -fL "$MC420/test-audio-corpus/instruments/$f.wav" -o "in/$f.wav"
          done
          python3 tools/render-gate/make_sines.py in
          ls -la in
      - name: Build the harness
        run: |
          set -e
          LIB=thirdparty/libfaust/ubuntu-x86_64/Release/lib/libfaustwithllvm.a
          SRC="-I thirdparty/faust/architecture -I thirdparty/libfaust/ubuntu-x86_64/Release"
          # createDSPFactoryFromFile is declared taking a std::string, so
          # the harness and the archive must agree on the string ABI or
          # the link fails. Measured: with the 2.85.9 release archive the
          # default (C++11) ABI is the one that links, so the old-ABI
          # attempt below is kept only as a self-describing probe; do not
          # record it as the fix. If neither links, build_oldabi.log and
          # this step's output name which was tried.
          if g++ -O2 -std=c++17 -Wall -Wextra $SRC \
            -D_GLIBCXX_USE_CXX11_ABI=0 \
            tools/render-gate/render_gate.cpp "$LIB" \
            -lz -lpthread -ldl -lm -ltinfo -o render_gate 2> build_oldabi.log; then
            echo "linked with _GLIBCXX_USE_CXX11_ABI=0"
          else
            echo "old-ABI link failed, retrying with the default ABI"
            cat build_oldabi.log
            g++ -O2 -std=c++17 -Wall -Wextra $SRC \
              tools/render-gate/render_gate.cpp "$LIB" \
              -lz -lpthread -ldl -lm -ltinfo -o render_gate
          fi
      - name: Compile v3 and render the gate set in one process
        run: |
          set -e
          mkdir -p out
          # No ulimit -v on purpose. A virtual cap does not track RSS:
          # LLVM reserves far more address space than it touches, so a cap
          # fails the job before memory is actually short. Measured: at a
          # 14 GB virtual cap this job died with bad_alloc/SIGABRT at
          # 10,317,200 kB RSS, well under both the cap and the runner; with
          # a 60 GB cap it produced no output at all for an hour. Running
          # uncapped is what lets the report name a real ceiling, if one
          # exists. Do not re-add a cap without a measured reason.
          /usr/bin/time -v ./render_gate v3.dsp "$GAIN" out/gate in/*.wav 2> gate.time &
          TPID=$!
          # Sample the render process, not the time wrapper: GNU time
          # forks, so VmRSS of $TPID is the wrapper's.
          RPID=""
          for i in $(seq 1 50); do
            RPID=$(pgrep -P "$TPID" -n 2>/dev/null || true)
            [ -n "$RPID" ] && break
            sleep 0.2
          done
          echo "# sampled pid ${RPID:-none}" >> rss.trace
          TARGET=${RPID:-$TPID}
          while kill -0 "$TARGET" 2>/dev/null; do
            v=$(awk '/VmRSS/{print $2}' "/proc/$TARGET/status" 2>/dev/null || true)
            if [ -n "$v" ]; then
              # Print as well as write: a killed runner takes its filesystem
              # with it, so the job log is the only place a sample survives.
              echo "$(date -u +%FT%TZ) rss_kb $v"
              echo "$(date -u +%s) $v" >> rss.trace
            fi
            sleep 5
          done
          rc=0; wait "$TPID" || rc=$?
          echo "rc=$rc" >> gate.rc
          echo "peak_kb $(awk '{if ($2 > m) m = $2} END {print m+0}' rss.trace)" >> gate.rc
      - name: Report the memory ceiling
        if: always()
        run: |
          echo "--- rss.trace peak and tail ---"
          awk '{if ($2 > m) m = $2} END {print "peak_kb " m+0}' rss.trace 2>/dev/null || true
          tail -5 rss.trace 2>/dev/null || true
          echo "--- gate.rc ---"
          cat gate.rc 2>/dev/null || true
          echo "--- gate.time ---"
          grep -E "Maximum resident|Elapsed|Exit status" gate.time 2>/dev/null || true
      - name: Upload the traces and the memory report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-gate
          path: |
            out/
            rss.trace
            gate.rc
            gate.time
          if-no-files-found: warn
          retention-days: 14
